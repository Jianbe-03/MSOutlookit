<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSOutlookit - Version Selector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        .version-link {
            display: block;
            margin: 20px 0;
            padding: 15px 30px;
            background-color: #0078d4;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .version-link:hover {
            background-color: #005a9e;
        }
        .description {
            margin-top: 30px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MSOutlookit</h1>
        <p>Choose your Outlook version:</p>
        <a href="versions/2025/" class="version-link">Outlook 2025 (Latest)</a>
        <a href="versions/2013/" class="version-link">Outlook 2013</a>
        <a href="versions/2004/" class="version-link">Outlook 2004 (Classic)</a>
        <div class="description">
            <p>MSOutlookit is a fun project that reskins Reddit to look like Microsoft Outlook.</p>
            <p><a href="README.md">View README</a></p>
        </div>
    </div>
</body>
</html>
